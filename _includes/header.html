<header class="site-header">
  <div class="wrapper">

    <a class="site-title" href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>

    <nav class="site-nav">
      {% for page in site.pages %}
        {% if page.title and page.nav != false %}
          <a class="page-link" href="{{ page.url | relative_url }}">
            {{ page.title }}
          </a>
        {% endif %}
      {% endfor %}
    </nav>

  </div>
</header>
